<body>

  <div class="container">
    <header class="blog-header">

    </header>
    <main id="inhalt">

    <!-- Post Listing -->
    <div class="post-list-view" id="postList">
      <div class="blog-layout">
        <div class="blog-main">
          <ul class="post-list" id="postListUl" aria-busy="true">
            <li class="post-skeleton" aria-hidden="true"><span class="skeleton-bar skeleton-bar--meta"></span><span class="skeleton-bar skeleton-bar--title"></span><span class="skeleton-bar skeleton-bar--text"></span><span class="skeleton-bar skeleton-bar--text-short"></span></li>
            <li class="post-skeleton" aria-hidden="true"><span class="skeleton-bar skeleton-bar--meta"></span><span class="skeleton-bar skeleton-bar--title"></span><span class="skeleton-bar skeleton-bar--text"></span><span class="skeleton-bar skeleton-bar--text-short"></span></li>
            <li class="post-skeleton" aria-hidden="true"><span class="skeleton-bar skeleton-bar--meta"></span><span class="skeleton-bar skeleton-bar--title"></span><span class="skeleton-bar skeleton-bar--text"></span><span class="skeleton-bar skeleton-bar--text-short"></span></li>
          </ul>
        </div>
        <aside class="blog-sidebar">
          <div class="rss-cta rss-cta-sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 019 9M4 4a16 16 0 0116 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
            <div>
              <strong>Keine neuen Beiträge verpassen</strong>
              <p>Abonniere den Blog per RSS Feed und erhalte neue Posts direkt in deinem Feedreader.</p>
            </div>
            <a href="../feed.xml" class="rss-cta-btn" target="_blank" rel="noopener">RSS Feed abonnieren</a>
          </div>
        </aside>
      </div>
    </div>

    </main>
    <div id="shared-footer">
      <!-- Statische Fassung: components.js ersetzt diesen Block per outerHTML.
           Steht hier, damit die Pflichtangaben nicht am JavaScript haengen. -->
      <footer class="footer">
        <a href="../kontakt.html" class="footer-contact">Kontakt</a>
        <a href="../impressum.html">Impressum</a>
        &middot;
        <a href="../datenschutz.html">Datenschutz</a>
        &middot;
        <a href="../agb.html">AGB</a>
        &middot;

  <script src="render.js"></script>
  <script>
    // Blog-Liste + Einzelansicht werden datengetrieben aus posts.json und dem
    // Frontmatter der .md-Dateien erzeugt (siehe render.js). Kein Framework.
    var B = window.BlogRender;

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function cardHtml(p) {
      var size = B.imageAttrs(p.thumb);
      var webp = p.thumb.replace(/\.(jpe?g|png)$/i, '.webp');
      var thumb = p.thumb
        ? '<div class="post-thumb"><picture><source srcset="' + escapeHtml(webp) + '" type="image/webp">' +
          '<img src="' + escapeHtml(p.thumb) + '" alt="' + escapeHtml(p.thumbAlt) + '"' + size + ' loading="lazy">' +
          '</picture></div>'
        : '';
      var tags = p.tags.map(function (t) {
        return '<span class="post-tag">' + escapeHtml(t) + '</span>';
      }).join('');
      var cls = 'post-item' + (p.thumb ? ' post-item--with-image' : '');
      return '<li class="' + cls + '">' +
        '<a href="' + encodeURIComponent(p.slug) + '.html">' + thumb +
        '<div class="post-body">' +
        '<div class="post-meta"><span class="post-date">' + escapeHtml(p.dateDE) + '</span>' + tags + '</div>' +
        '<h2 class="post-title">' + escapeHtml(p.title) + '</h2>' +
        '<p class="post-excerpt">' + escapeHtml(p.excerpt) + '</p>' +
        '</div></a></li>';
    }

    function loadPosts() {
      // Bildmasse zuerst: ohne sie rendern die Kacheln ohne width/height und
      // die Liste springt beim Nachladen der Vorschaubilder.
      return fetch('images/sizes.json')
        .then(function (r) { return r.ok ? r.json() : {}; })
        .catch(function () { return {}; })
        .then(function (sizes) {
          B.setImageSizes(sizes);
          return fetch('posts.json');
        })
        .then(function (r) { return r.json(); })
        .then(function (slugs) {
          return Promise.all(slugs.map(function (slug) {
            return fetch(slug + '.md')
              .then(function (r) { return r.ok ? r.text() : ''; })
              .then(function (md) {
                if (!md) return null;
                var d = B.parseFrontmatter(md).data;
                return {
                  slug: slug,
                  title: d.title || slug,
                  date: d.date || '',
                  dateDE: B.formatDateDE(d.date),
                  tags: d.tags || [],
                  excerpt: d.excerpt || '',
                  thumb: d.thumb || '',
                  thumbAlt: d.thumbAlt || ''
                };
              })
              .catch(function () {
                // Aussortieren, nicht leer rendern: ein Eintrag mit dem Slug als
                // Titel und ohne Inhalt ist von "gibt es nicht" nicht zu
                // unterscheiden und sieht aus wie ein kaputter Beitrag.
                return null;
              });
          }));
        })
        .then(function (posts) {
          var ok = posts.filter(Boolean);
          if (ok.length < posts.length) {
            // Sichtbar im Log, unsichtbar auf der Seite: ein fehlender Beitrag
            // ist ein Pflegefehler, kein Zustand, den der Leser klaeren kann.
            console.warn('Blog: ' + (posts.length - ok.length) + ' Beitrag/Beitraege nicht ladbar');
          }
          // Nach Datum absteigend (neueste zuerst) — ausdrücklich nicht alphabetisch
          ok.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
          return ok;
        });
    }

    function renderList(posts) {
      var ul = document.getElementById('postListUl');
      ul.removeAttribute('aria-busy');
      if (!posts.length) {
        ul.innerHTML = '<li class="blog-message"><strong>Die Beiträge konnten nicht geladen werden.</strong>' +
          'Das liegt an dieser Seite, nicht an dir. Lade die Seite neu — oder lies die Beiträge ' +
          'so lange im <a href="../feed.xml">RSS-Feed</a>.</li>';
        return;
      }
      ul.innerHTML = posts.map(cardHtml).join('');
    }

    // Beitraege haben eigene Seiten (blog/<slug>.html, erzeugt von
    // scripts/build.mjs). Alte Links der Form blog/#slug — aus LinkedIn, aus
    // Lesezeichen, aus den Feed-Guids — werden dorthin umgeleitet.
    function routeHash() {
      var hash = decodeURIComponent(window.location.hash.slice(1));
      if (hash && /^[a-z0-9-]+$/.test(hash)) {
        window.location.replace(hash + '.html');
        return true;
      }
      return false;
    }

    if (!routeHash()) {
      loadPosts()
        .then(renderList)
        .catch(function (err) {
          // Ohne diesen Zweig bleibt bei einem Ausfall von posts.json das
          // Skelett stehen — eine Seite, die fuer immer laedt.
          console.error('Blog: Beitragsliste nicht ladbar', err);
          renderList([]);
        });
    }

    window.addEventListener('hashchange', routeHash);
  </script>

  <div id="shared-overlays"></div>
  <script src="../components.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
